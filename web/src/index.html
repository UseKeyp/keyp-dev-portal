<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyp Developer Portal</title>
  <meta
    property="og:title"
    content="Keyp Developer Portal"
  />
  <meta
    property="og:description"
    content="Manage Your Games and Apps on Keyp - Powerful Web3 Onboarding for Games and Apps"
  />
  <meta property="og:url" content="https://dashboard.usekeyp.com" />
  <meta property="og:image" content="https://dashboard.usekeyp.com/seo.png" />
  <meta
    property="twitter:image"
    content="https://dashboard.usekeyp.com/seo.png"
  />
  <meta property="og:type" content="website" />
  <meta name="author" content="Keyp" />

  <!-- Twitter  -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@usekeyp" />

  <!-- Main Link Tags  -->
  <link
    rel="stylesheet"
    href="https://api.fonts.coollabs.io/css2?family=Inter"
  />
  <link
    rel="icon" href="/favicon.svg" type="image/svg+xml"
  />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <!-- iOS  -->
  <meta name="apple-mobile-web-app-title" content="Keyp App" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <link
    href="images/ios/touch-icon-start-up-320x480.png"
    rel="apple-touch-startup-image"
  />
  <link href="images/ios/touch-icon-iphone.png" rel="apple-touch-icon" />
  <link
    href="images/ios/AppIcon~ipad.png"
    rel="apple-touch-icon"
    sizes="76x76"
  />
  <link
    href="images/ios/AppIcon-40@3x.png"
    rel="apple-touch-icon"
    sizes="120x120"
  />
  <link
    href="images/ios/AppIcon@2x~ipad.png"
    rel="apple-touch-icon"
    sizes="152x152"
  />
  <!-- PWA  -->
  <link href="/manifest.json" rel="manifest" />
  <meta name="theme-color" content="#1499DA" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>

<body>
  <div id="redwood-app">
    <!-- Please keep the line below for prerender support. -->
    <%= prerenderPlaceholder %>
  </div>
</body>
</html>
